<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Prakhar Innovations</title>
  <link rel="icon" href="images/prakhar-logo.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/style.css" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Source Code Pro', monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .error-container {
      text-align: center;
      background: white;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      max-width: 500px;
      width: 90%;
    }

    .error-logo {
      height: 80px;
      margin-bottom: 1.5rem;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: #212529;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 1.5rem;
    }

    .error-text {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-block;
      background: transparent;
      color: #0d6efd;
      border: 2px solid #0d6efd;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="error-container">
    <img src="images/prakhar-logo.png" alt="Prakhar Innovations Logo" class="error-logo" />
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-text">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="index.html" class="btn-home">Return Home</a>
  </div>
</body>

</html>
